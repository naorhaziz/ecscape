[package]
name = "ecscape"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
async-stream = "0.3.6"
aws-config = { version = "1.6.1", features = [
    "behavior-version-latest",
    "rustls",
] }
aws-sdk-ecs = { version = "1.72.0", features = [
    "behavior-version-latest",
    "rustls",
] }
aws-sdk-s3 = { version = "1.81.0", features = [
    "behavior-version-latest",
    "rustls",
] }
aws-sigv4 = "1.3.0"
aws-types = "1.3.6"
clap = { version = "4.5.34", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
] }
futures-util = "0.3.31"
mimalloc = { version = "0.1.44", features = ["secure"] }
regex = "1.11.1"
reqwest = { version = "0.12.15", default-features = false, features = [
    "rustls-tls",
    "json",
] }
rustls = { version = "0.23.25", features = ["ring"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
tokio-rustls = "0.26.2"
tokio-tungstenite = { version = "0.26.2", default-features = false, features = [
    "connect",
    "tokio-rustls",
    "rustls-tls-webpki-roots",
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.4"
