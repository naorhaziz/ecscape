[package]
name = "ecscape"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.44.1", features = ["full"] }
anyhow = "1.0.97"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
mimalloc = { version = "0.1.44", features = ["secure"] }
reqwest = { version = "0.12.15", features = ["rustls-tls", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
regex = "1.11.1"
aws-sdk-ecs = { version = "1.72.0", features = ["behavior-version-latest"] }
aws-types = "1.3.6"
aws-sigv4 = "1.3.0"
url = "2.5.4"
tokio-rustls = "0.26.2"
tokio-tungstenite = { version = "0.26.2", features = [
    "tokio-rustls",
    "rustls-tls-webpki-roots",
] }
futures-util = "0.3.31"
async-stream = "0.3.6"
