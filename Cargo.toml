[package]
name = "ecscape"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
aws-sdk-ecs = { version = "1.89.0", features = [
    "behavior-version-latest",
    "rustls",
] }
aws-types = "1.3.7"
clap = { version = "4.5.41", features = ["derive", "env"] }
mimalloc = "0.1.47"
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
tokio = { version = "1.46.1", features = ["full"] }
tokio-tungstenite = { version = "0.27.0", features = [
    "rustls-tls-native-roots",
] }
tokio-retry2 = "0.5.7"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.4"
aws-sigv4 = "1.3.3"
aws-credential-types = "1.2.4"
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = "0.3.31"

[profile.release]
strip = "debuginfo"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
